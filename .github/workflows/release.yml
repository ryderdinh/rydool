name: Release macOS app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build universal release
        run: RYDOOL_SIGN_IDENTITY=- ARCHS="arm64 x86_64" Scripts/build-app.sh release
      - name: Install DMG packaging tool
        run: |
          python3 -m venv "$RUNNER_TEMP/rydool-dmg-venv"
          "$RUNNER_TEMP/rydool-dmg-venv/bin/pip" install dmgbuild==1.6.6
      - name: Package app
        run: DMG_PYTHON="$RUNNER_TEMP/rydool-dmg-venv/bin/python" Scripts/package-dmg.sh
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version - " 'index($0, "## ") == 1 { if (found) exit; if (index($0, heading) == 1) found=1; next } found { print }' CHANGELOG.md > build/release-notes.md
          test -s build/release-notes.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Rydool-macos.dmg
          body_path: build/release-notes.md
